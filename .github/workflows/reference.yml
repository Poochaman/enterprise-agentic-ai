name: Reference workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m reference.evaluate
      - run: python -m reference.demo --data .reference-data/demo
      - run: python -m reference.demo --data .reference-data/demo
      - run: python -m reference.smoke
      - run: python -m unittest discover -s examples/tests -v
      - run: python examples/smoke.py
